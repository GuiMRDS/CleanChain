name: CI

# Testes a cada push e pull request, nos três sistemas: backend (pytest, com as regras de
# exclusão de cada sistema), build da interface, tipos do app desktop e teste de fumaça do
# Electron com o backend real.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Linux — tela virtual e sandbox do Chromium
        if: runner.os == 'Linux'
        # O Ubuntu 24.04 restringe user namespaces (AppArmor), que o sandbox do Electron usa.
        # Liberado só no runner de testes; o app instalado pelo .deb traz o perfil AppArmor.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb lsof
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Backend — dependências
        working-directory: backend
        run: uv sync --frozen

      - name: Backend — testes de segurança
        working-directory: backend
        run: uv run python -m pytest

      - name: Interface — testes (Vitest) e build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Desktop — dependências e tipos
        working-directory: desktop
        run: |
          npm ci
          npm run build:ts

      - name: Desktop — teste de fumaça (Electron + backend via uv)
        working-directory: desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run test:fumaca; else npm run test:fumaca; fi
