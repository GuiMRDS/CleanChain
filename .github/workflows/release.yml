name: Release

# Tag v* (ex.: v0.1.0, igual à versão de desktop/package.json): testa, empacota o backend com
# PyInstaller, gera o instalador e publica no GitHub Releases (o electron-updater busca lá).
# Disparo manual: faz tudo, menos publicar — o instalador fica como artefato do workflow.
#
# Assinatura de código (Azure Trusted Signing): liga sozinha quando o repositório tem
#   variáveis  AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE, AZURE_SIGNING_PUBLISHER
#   segredos   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
# Sem elas, o instalador sai sem assinatura (como antes). Com elas, tudo é assinado e o
# workflow falha se sobrar algum binário sem assinatura. Passo a passo: docs/assinatura.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ASSINAR: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Versão da tag confere com o app
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app="$(node -p "require('./desktop/package.json').version")"
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não confere com desktop/package.json ($app)."
            exit 1
          fi

      - name: Backend — testes de segurança
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python -m pytest

      - name: Interface — build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend — PyInstaller
        working-directory: backend
        run: uv run python -m PyInstaller cleanchain-backend.spec --noconfirm --clean

      - name: Assinatura — backend (.exe, .pyd e DLLs sem assinatura)
        if: env.ASSINAR == 'true'
        shell: pwsh
        run: ./desktop/scripts/assinar-backend.ps1

      - name: Desktop — compilar
        working-directory: desktop
        run: |
          npm ci
          npm run build:ts

      - name: Fumaça — Electron com o backend empacotado
        working-directory: desktop
        env:
          CLEANCHAIN_BACKEND_EXE: ../backend/dist/cleanchain-backend/cleanchain-backend.exe
        run: npm run test:fumaca

      - name: Instalador
        working-directory: desktop
        shell: bash
        run: |
          args=(--win --publish never)
          if [ "$ASSINAR" = "true" ]; then
            # Assina CleanChain.exe, instalador e desinstalador; o electron-updater passa a
            # exigir que as atualizações venham assinadas pelo mesmo publicador.
            args+=(
              -c.win.azureSignOptions.endpoint="$AZURE_SIGNING_ENDPOINT"
              -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGNING_ACCOUNT"
              -c.win.azureSignOptions.certificateProfileName="$AZURE_SIGNING_PROFILE"
              -c.win.azureSignOptions.publisherName="$AZURE_SIGNING_PUBLISHER"
            )
          fi
          npx electron-builder "${args[@]}"

      - name: Assinatura — conferir todos os binários
        if: env.ASSINAR == 'true'
        shell: pwsh
        working-directory: desktop/release
        run: |
          $binarios = @(Get-ChildItem -File CleanChain-Setup-*.exe) + @(Get-ChildItem win-unpacked -Recurse -File -Include *.exe, *.dll, *.pyd)
          $sem = $binarios | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($sem) { $sem.FullName; throw "$($sem.Count) binário(s) sem assinatura válida." }
          "Todos os $($binarios.Count) binários estão assinados."

      - name: Fumaça — app empacotado com Fuses
        working-directory: desktop
        env:
          CLEANCHAIN_EXE: release/win-unpacked/CleanChain.exe
        run: npm run test:fumaca

      - name: Artefato (disparo manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CleanChain-instalador
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
          retention-days: 14

      - name: Publicar no GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: desktop/release
        # latest.yml + .exe + .blockmap: o que o electron-updater precisa para atualizar.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "CleanChain $GITHUB_REF_NAME" \
            --notes "$( [ "$ASSINAR" = "true" ] && echo 'Instalador para Windows, assinado.' || echo 'Instalador para Windows. Sem assinatura de código: veja a seção de instalação do README sobre o SmartScreen e o Smart App Control.' )" \
            CleanChain-Setup-*.exe CleanChain-Setup-*.exe.blockmap latest.yml
